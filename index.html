<!doctype html>
<meta charset="utf-8">
<title>BOLT Workflow Planner</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:760px;margin:48px auto;padding:0 20px;color:#111}
textarea,input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:10px}
button{padding:12px 18px;border:0;border-radius:999px;background:#111;color:#fff}
.card{margin-top:18px;padding:18px;background:#f4f4f4;border-radius:16px}
small{color:#666}
</style>
<h1>BOLT Workflow Planner</h1>
<p>Turn one task into a small governed AI workflow before you build it.</p>
<label>Task</label>
<textarea id="task" rows="4" placeholder="Example: summarize support tickets and draft a reply"></textarea>
<label>What action would be risky if automated?</label>
<input id="risk" placeholder="Example: sending the reply">
<button onclick="plan()">Create plan</button>
<div id="result"></div>
<script>
function plan(){
 const task=document.getElementById('task').value.trim();
 const risk=document.getElementById('risk').value.trim();
 if(!task){alert('Add a task first');return}
 const steps=[
  {step:1,action:'Understand the task',control:'allow'},
  {step:2,action:'Gather only required context',control:'allow'},
  {step:3,action:'Produce a draft or proposed action',control:'allow'},
  {step:4,action:risk||'Any consequential external action',control:'human approval required'},
  {step:5,action:'Record outcome and errors',control:'audit'}
 ];
 document.getElementById('result').innerHTML='<div class="card"><b>'+escapeHtml(task)+'</b><pre>'+escapeHtml(JSON.stringify(steps,null,2))+'</pre><small>POC: planning and control boundaries before implementation.</small></div>';
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
